[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "An intelligent AI-powered desktop assistant for organizing files."
authors = [{name = "Jay"}]
dependencies = [
    "typer",
    "rich",
    "watchdog",
    "scikit-learn",
    "joblib"
]

[project.scripts]
organizer = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
