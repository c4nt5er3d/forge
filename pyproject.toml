[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "An intelligent AI-powered desktop assistant for organizing files."
authors = [{name = "Jay"}]
dependencies = [
    "typer",
    "rich",
    "watchdog"
]

[project.optional-dependencies]
ml = [
    "scikit-learn",
    "joblib"
]
ai = [
    "sentence-transformers",
    "faiss-cpu",
    "ollama",
    "pytesseract",
    "Pillow",
    "PyPDF2"
]
full = [
    "scikit-learn",
    "joblib",
    "sentence-transformers",
    "faiss-cpu",
    "ollama",
    "pytesseract",
    "Pillow",
    "PyPDF2"
]

[project.scripts]
forge = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
