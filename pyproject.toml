[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "An intelligent AI-powered desktop assistant for organizing files."
authors = [{name = "Jay"}]
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "watchdog"
]

[project.optional-dependencies]
ml = [
    "scikit-learn",
    "joblib"
]
ai = [
    "sentence-transformers",
    "faiss-cpu",
    "ollama",
    "pytesseract",
    "Pillow",
    "PyPDF2"
]
full = [
    "scikit-learn",
    "joblib",
    "sentence-transformers",
    "faiss-cpu",
    "ollama",
    "pytesseract",
    "Pillow",
    "PyPDF2"
]
dev = [
    "pytest",
    "ruff",
    "scikit-learn",
    "joblib",
    "sentence-transformers",
    "faiss-cpu",
    "ollama",
    "pytesseract",
    "Pillow",
    "PyPDF2"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "models",
    "dist",
    "build",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[project.scripts]
forge = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
